<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>屏幕批注</title>
  <link rel="stylesheet" href="../OrbiBoard/renderer/remixicon-local.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="canvas-layer"></canvas>

  <div class="action-controls" id="left-controls" style="display: none;">
    <button class="icon-only-btn" id="btn-save" title="Save"><i class="ri-save-line"></i></button>
    <button class="icon-only-btn" id="btn-close-wb" title="Close"><i class="ri-close-line"></i></button>
  </div>

  <div class="toolbar-container">
    <div class="toolbar" id="main-toolbar">
      <!-- Tools will be injected here -->
    </div>
  </div>

  <div class="page-controls" id="page-controls" style="display: none;">
    <button class="icon-only-btn" id="btn-prev-page"><i class="ri-arrow-left-s-line"></i></button>
    <span id="page-indicator">1 / 1</span>
    <button class="icon-only-btn" id="btn-next-page"><i class="ri-arrow-right-s-line"></i></button>
    <button class="icon-only-btn" id="btn-add-page"><i class="ri-add-line"></i></button>
  </div>

  <script src="./renderer.js"></script>
</body>
</html>
