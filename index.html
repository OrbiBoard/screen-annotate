<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>屏幕批注</title>
  <link rel="stylesheet" href="../../renderer/remixicon-local.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="canvas-layer"></canvas>
  <div id="selection-overlay" class="selection-overlay" style="display: none;">
    <div class="selection-box-dom"></div>
    <!-- Handles will be added via JS -->
  </div>

  <!-- Tool Settings Popup -->
  <div id="tool-settings-popup" class="tool-settings-popup" style="display: none;">
    <div id="pen-settings" class="settings-group" style="display: none;">
       <div class="color-options">
         <!-- Fix for Issue 4: Add black color -->
         <div class="color-swatch" style="background: #000000; border-color: rgba(255,255,255,0.3)" data-color="#000000"></div>
         <div class="color-swatch" style="background: #ffffff" data-color="#ffffff"></div>
         <div class="color-swatch" style="background: #ff4d4f" data-color="#ff4d4f"></div>
         <div class="color-swatch" style="background: #fadb14" data-color="#fadb14"></div>
         <div class="color-swatch" style="background: #52c41a" data-color="#52c41a"></div>
         <div class="color-swatch" style="background: #1890ff" data-color="#1890ff"></div>
       </div>
       <div class="separator-h"></div>
       <div class="slider-container">
         <span>粗细: </span>
         <input type="range" id="pen-size-slider" min="1" max="50" value="6">
         <span id="pen-size-display">6</span>
       </div>
       <div class="slider-container">
         <span>笔锋: </span>
         <label class="switch">
           <input type="checkbox" id="pen-taper-toggle">
           <span class="slider round"></span>
         </label>
       </div>
    </div>
    <div id="eraser-settings" class="settings-group" style="display: none;">
       <div class="eraser-options">
         <div class="eraser-preset" data-size="50" style="width: 20px; height: 20px;"></div>
         <div class="eraser-preset active" data-size="100" style="width: 30px; height: 30px;"></div>
         <div class="eraser-preset" data-size="200" style="width: 40px; height: 40px;"></div>
       </div>
       <div class="separator-h"></div>
       <button class="text-btn small clear-page-btn" id="btn-clear-page">
         <i class="ri-delete-bin-line"></i> 清页
       </button>
    </div>
    <div id="pan-settings" class="settings-group" style="display: none;">
     <button class="text-btn small" id="btn-pan-reset" style="margin-right: 8px;">
       <i class="ri-refresh-line"></i> 复位
     </button>
     <button class="text-btn small" id="btn-pan-fit">
       <i class="ri-aspect-ratio-line"></i> 适合
     </button>
  </div>
  <div id="shape-settings" class="settings-group" style="display: none;">
      <div class="shape-header">
          <span>选择形状</span>
          <div style="display: flex; align-items: center; gap: 8px;">
            <label class="switch" style="transform: scale(0.8);">
                <input type="checkbox" id="shape-pin-toggle">
                <span class="slider round"></span>
            </label>
            <span style="font-size: 12px;">连续绘制</span>
          </div>
      </div>
      <div class="shape-grid">
          <!-- 2D Shapes -->
          <div class="shape-btn-container" data-shape="line">
              <i class="ri-subtract-line"></i><span>直线</span>
          </div>
          <div class="shape-btn-container" data-shape="arrow">
              <i class="ri-arrow-right-line"></i><span>单箭头</span>
          </div>
          <div class="shape-btn-container" data-shape="double-arrow">
              <i class="ri-arrow-left-right-line"></i><span>双箭头</span>
          </div>
          <div class="shape-btn-container" data-shape="rect">
              <i class="ri-checkbox-blank-line"></i><span>矩形</span>
          </div>
          <div class="shape-btn-container" data-shape="square">
              <i class="ri-stop-line"></i><span>正方形</span>
          </div>
          <div class="shape-btn-container" data-shape="triangle">
              <i class="ri-play-line" style="transform: rotate(-90deg);"></i><span>三角形</span>
          </div>
          <div class="shape-btn-container" data-shape="circle">
              <i class="ri-checkbox-blank-circle-line"></i><span>圆形</span>
          </div>
          <div class="shape-btn-container" data-shape="ellipse">
              <i class="ri-loader-3-line"></i><span>椭圆</span>
          </div>
          <div class="shape-btn-container" data-shape="parallelogram">
              <i class="ri-shape-2-line"></i><span>平行四边形</span>
          </div>
          <div class="shape-btn-container" data-shape="pentagon">
              <i class="ri-pentagon-line"></i><span>五边形</span>
          </div>
          <div class="shape-btn-container" data-shape="hexagon">
              <i class="ri-hexagon-line"></i><span>六边形</span>
          </div>
          <!-- 3D / Complex -->
          <div class="shape-btn-container" data-shape="cuboid">
              <i class="ri-inbox-line"></i><span>长方体</span>
          </div>
          <div class="shape-btn-container" data-shape="cone">
              <i class="ri-filter-3-line"></i><span>圆锥</span>
          </div>
          <div class="shape-btn-container" data-shape="axis-xy">
              <i class="ri-ruler-line"></i><span>XY轴</span>
          </div>
          <div class="shape-btn-container" data-shape="axis-xyz">
              <i class="ri-compass-3-line"></i><span>XYZ轴</span>
          </div>
      </div>
  </div>
  </div>

  <div class="bottom-controls left" id="left-controls" style="display: none;">
    <!-- Pan Overlay (Mini Map + Toolbar) -->
    <div id="pan-overlay" style="display: none; position: absolute; bottom: 100%; left: 0; margin-bottom: 10px; flex-direction: column; gap: 8px;">
        <div id="pan-mini-toolbar" style="display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 4px;">
            <button class="icon-only-btn" id="btn-pan-zoom-out" title="缩小"><i class="ri-subtract-line"></i></button>
            <button class="icon-only-btn" id="btn-pan-zoom-reset" title="100%"><i class="ri-search-eye-line"></i></button>
            <button class="icon-only-btn" id="btn-pan-zoom-in" title="放大"><i class="ri-add-line"></i></button>
            <div class="separator-v" style="width: 1px; background: var(--border); margin: 0 4px;"></div>
            <button class="icon-only-btn" id="btn-pan-fit-screen" title="适应屏幕"><i class="ri-aspect-ratio-line"></i></button>
            <button class="icon-only-btn" id="btn-pan-toggle-map" title="切换地图"><i class="ri-map-2-line"></i></button>
        </div>
        <div id="pan-minimap-container" style="width: 200px; height: 150px; background: rgba(0,0,0,0.5); border: 1px solid var(--border); border-radius: 6px; position: relative; overflow: hidden;">
            <canvas id="minimap-canvas" style="width: 100%; height: 100%; display: block;"></canvas>
            <div id="minimap-viewport" style="position: absolute; border: 2px solid #1890ff; box-shadow: 0 0 0 1000px rgba(0,0,0,0.5); cursor: grab;"></div>
        </div>
    </div>

    <button class="tool-btn" id="btn-collapse">
      <i class="ri-close-circle-line"></i>
      <span>关闭</span>
    </button>
    <button class="tool-btn" id="btn-save-wb">
      <i class="ri-save-line"></i>
      <span>保存</span>
    </button>
    <button class="tool-btn" id="btn-insert-media">
      <i class="ri-add-line"></i>
      <span>插入</span>
    </button>
  </div>

  <!-- Shape Status Popup (Top of Toolbar) -->
  <div id="shape-status-popup" class="shape-status-popup" style="display: none;">
      <div class="shape-status-left">
          <span id="shape-status-text">绘制“矩形”</span>
      </div>
      <div class="shape-status-center">
          <!-- Steps injected here -->
          <div class="step-indicator active">1</div>
          <span class="step-desc">确定起点</span>
          <div class="step-line"></div>
          <div class="step-indicator">2</div>
          <span class="step-desc">确定终点</span>
      </div>
      <div class="shape-status-right">
          <button class="text-btn small" id="btn-change-shape">
              <i class="ri-shape-line"></i> 更改形状
          </button>
      </div>
  </div>

  <div class="toolbar-container">
    <div class="toolbar" id="main-toolbar">
      <!-- Tools will be injected here -->
    </div>
  </div>

  <div class="bottom-controls right" id="page-controls" style="display: none;">
    <button class="tool-btn" id="btn-insert-page">
      <i class="ri-add-circle-line"></i>
      <span>插页</span>
    </button>
    <button class="tool-btn" id="btn-prev-page">
      <i class="ri-arrow-left-s-line"></i>
      <span>上一页</span>
    </button>
    <div class="tool-btn" id="page-indicator-btn">
      <span id="page-indicator-text" class="indicator-top">1 / 1</span>
      <span class="indicator-bottom">页码</span>
    </div>
    <button class="tool-btn" id="btn-next-page">
      <i class="ri-arrow-right-s-line"></i>
      <span>下一页</span>
    </button>
  </div>

  <!-- Page Preview Popup (Vertical list above page controls) -->
  <div id="page-preview-popup" class="page-preview-popup" style="display: none;">
    <!-- Header hidden by CSS per request -->
    <div class="preview-header" style="display: none;">
      <span>页面预览</span>
      <button class="icon-only-btn" id="btn-close-preview"><i class="ri-close-line"></i></button>
    </div>
    <div id="page-list" class="page-list-vertical"></div>
  </div>

  <!-- Selection Toolbar -->
  <div id="selection-toolbar" class="selection-toolbar" style="display: none;">
    <button class="tool-btn small" id="btn-sel-clone">
      <i class="ri-file-copy-line"></i>
      <span>克隆</span>
    </button>
    <button class="tool-btn small" id="btn-sel-clone-page">
      <i class="ri-file-add-line"></i>
      <span>新页克隆</span>
    </button>
    <button class="tool-btn small" id="btn-sel-adjust">
      <i class="ri-settings-line"></i>
      <span>调整</span>
    </button>
    <button class="tool-btn small" id="btn-sel-delete">
      <i class="ri-delete-bin-line"></i>
      <span>删除</span>
    </button>
  </div>

  <!-- Adjustment Popup -->
  <div id="adjust-popup" class="tool-settings-popup" style="display: none;">
     <div class="settings-group">
       <div class="color-options">
         <div class="color-swatch adjust-swatch" style="background: #ffffff" data-color="#ffffff"></div>
         <div class="color-swatch adjust-swatch" style="background: #ff4d4f" data-color="#ff4d4f"></div>
         <div class="color-swatch adjust-swatch" style="background: #fadb14" data-color="#fadb14"></div>
         <div class="color-swatch adjust-swatch" style="background: #52c41a" data-color="#52c41a"></div>
         <div class="color-swatch adjust-swatch" style="background: #1890ff" data-color="#1890ff"></div>
       </div>
       <div class="slider-container">
         <span>粗细: </span>
         <input type="range" id="adjust-size-slider" min="1" max="50" value="4">
         <span id="adjust-size-display">4</span>
       </div>
     </div>
  </div>

  <!-- Insert Menu Popup -->
  <div id="insert-menu-popup" class="tool-settings-popup" style="display: none;">
    <div class="settings-group">
       <button class="text-btn small" id="btn-insert-file" style="justify-content: flex-start;">
         <i class="ri-file-line"></i> 本地文件 (图片/音视频)
       </button>
       <button class="text-btn small" id="btn-insert-browser" style="justify-content: flex-start;">
         <i class="ri-global-line"></i> 网页浏览器
       </button>
       <button class="text-btn small" id="btn-insert-link" style="justify-content: flex-start;">
         <i class="ri-link"></i> 超链接
       </button>
       <button class="text-btn small" id="btn-insert-text" style="justify-content: flex-start;">
         <i class="ri-text"></i> 文本组件
       </button>
       <button class="text-btn small" id="btn-insert-screenshot" style="justify-content: flex-start;">
         <i class="ri-screenshot-2-line"></i> 从桌面截图
       </button>
    </div>
  </div>

  <!-- Text Edit Popup -->
  <div id="text-edit-popup" class="tool-settings-popup" style="display: none;">
      <div class="settings-group">
          <div class="text-edit-row">
              <select id="text-font-family" class="text-select">
                  <option value="Arial">Arial</option>
                  <option value="Times New Roman">Times New Roman</option>
                  <option value="Microsoft YaHei">微软雅黑</option>
                  <option value="SimSun">宋体</option>
                  <option value="KaiTi">楷体</option>
              </select>
              <select id="text-font-size" class="text-select" style="width: 60px;">
                  <option value="12">12</option>
                  <option value="14">14</option>
                  <option value="18">18</option>
                  <option value="24" selected>24</option>
                  <option value="36">36</option>
                  <option value="48">48</option>
                  <option value="72">72</option>
              </select>
          </div>
          <div class="text-edit-row">
              <button class="icon-only-btn" id="btn-text-bold" title="加粗"><i class="ri-bold"></i></button>
              <button class="icon-only-btn" id="btn-text-italic" title="斜体"><i class="ri-italic"></i></button>
              <button class="icon-only-btn" id="btn-text-underline" title="下划线"><i class="ri-underline"></i></button>
              <input type="color" id="text-color" value="#ffffff" style="width: 24px; height: 24px; border: none; padding: 0;">
          </div>
          <div class="separator-h"></div>
          <textarea id="text-content-input" rows="3" style="width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 4px; padding: 4px; resize: vertical;"></textarea>
      </div>
  </div>

  <!-- Modal Dialog for Input -->
  <div id="modal-dialog" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3 id="modal-title">请输入</h3>
      <div id="modal-fields" class="modal-fields-container">
          <!-- Fields injected here -->
      </div>
      <div class="modal-buttons">
        <button id="modal-cancel" class="text-btn">取消</button>
        <button id="modal-confirm" class="tool-btn small">确定</button>
      </div>
    </div>
  </div>

  <!-- Floating Media Controls -->
  <div id="media-controls" class="media-controls" style="display: none;">
    <button id="media-play-pause"><i class="ri-play-fill"></i></button>
    <div class="media-progress-container">
        <input type="range" class="media-progress" id="media-progress" min="0" max="100" value="0">
    </div>
    <span id="media-time" style="font-size: 12px; color: var(--muted); margin-right: 8px;">00:00 / 00:00</span>
    <button id="media-fullscreen"><i class="ri-fullscreen-line"></i></button>
    <button id="media-volume-btn"><i class="ri-volume-up-line"></i></button>
    <button id="media-close"><i class="ri-close-line"></i></button>
  </div>
  
  <!-- Volume Popup -->
  <div id="volume-popup" class="volume-popup" style="display: none;">
      <input type="range" id="volume-slider" min="0" max="100" value="100" orient="vertical">
  </div>

  <!-- Fullscreen Browser Layer -->
  <div id="fullscreen-browser-layer" class="fullscreen-browser-layer" style="display: none;">
    <!-- Webview will be injected here -->
  </div>

  <button id="fullscreen-exit-btn" class="fullscreen-exit-btn" style="display: none;">
      <i class="ri-fullscreen-exit-line"></i> 退出全屏
  </button>

  <!-- Edge Pan Buttons -->
  <div id="edge-pan-layer" style="display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;">
    <!-- Edges -->
    <button class="edge-pan-btn top" data-direction="up"><i class="ri-arrow-up-s-line"></i></button>
    <button class="edge-pan-btn bottom" data-direction="down"><i class="ri-arrow-down-s-line"></i></button>
    <button class="edge-pan-btn left" data-direction="left"><i class="ri-arrow-left-s-line"></i></button>
    <button class="edge-pan-btn right" data-direction="right"><i class="ri-arrow-right-s-line"></i></button>
    
    <!-- Corners -->
    <button class="edge-pan-btn corner tl" data-direction="tl"><i class="ri-arrow-left-up-line"></i></button>
    <button class="edge-pan-btn corner tr" data-direction="tr"><i class="ri-arrow-right-up-line"></i></button>
    <button class="edge-pan-btn corner bl" data-direction="bl"><i class="ri-arrow-left-down-line"></i></button>
    <button class="edge-pan-btn corner br" data-direction="br"><i class="ri-arrow-right-down-line"></i></button>
  </div>

  <!-- Screenshot UI -->
  <div id="screenshot-mask" style="display: none;"></div>
  <div id="screenshot-minibar" class="minibar" style="display: none;">
      <div class="minibar-drag-handle"><i class="ri-drag-move-2-fill"></i></div>
      <div class="minibar-content">
          <button id="btn-shot-full" class="tool-btn small">全屏截图</button>
          <button id="btn-shot-confirm" class="tool-btn small primary">确认</button>
          <button id="btn-shot-reselect" class="tool-btn small">重新选择</button>
      </div>
  </div>

  <!-- Selection Menu -->
  <div class="selection-menu" id="selection-menu" style="display: none;">
    <div class="menu-row main-row">
      <button class="menu-btn" data-action="delete" title="Delete">
        <i class="ri-delete-bin-line"></i>
        <span>删除</span>
      </button>
      <div class="separator-vertical"></div>
      <button class="menu-btn" data-action="copy" title="Copy">
        <i class="ri-file-copy-line"></i>
        <span>复制</span>
      </button>
      <div class="separator-vertical"></div>
      <button class="menu-btn" id="btn-layer-toggle" data-action="layer" title="Layer">
        <i class="ri-stack-line"></i>
        <span>层级</span>
      </button>
      <div class="separator-vertical"></div>
      <button class="menu-btn" data-action="cancel" title="Cancel">
        <i class="ri-close-line"></i>
        <span>取消</span>
      </button>
    </div>
    
    <div class="menu-row sub-row" id="layer-submenu">
        <div class="submenu-label">
            <i class="ri-stack-line"></i>
            <span>层级调整</span>
        </div>
        <button class="menu-btn" data-action="to-front" title="Bring to Front">
            <i class="ri-bring-to-front"></i>
            <span>置顶</span>
        </button>
        <button class="menu-btn" data-action="bring-forward" title="Bring Forward">
            <i class="ri-arrow-up-circle-line"></i>
            <span>上移</span>
        </button>
        <button class="menu-btn" data-action="send-backward" title="Send Backward">
            <i class="ri-arrow-down-circle-line"></i>
            <span>下移</span>
        </button>
        <button class="menu-btn" data-action="to-back" title="Send to Back">
            <i class="ri-send-to-back"></i>
            <span>置底</span>
        </button>
        <div class="separator-vertical"></div>
        <button class="menu-btn" data-action="collapse-layer" title="Close Layer Menu">
            <i class="ri-arrow-up-s-line"></i>
            <span>收起</span>
        </button>
    </div>
  </div>

  <!-- Gallery View -->
  <div id="gallery-view" style="display: none;">
    <button class="tool-btn" id="btn-gallery-return-live" style="width: 100%; margin-top: 8px;">
        <i class="ri-live-line"></i>
        <span>返回直播</span>
    </button>
    <div class="gallery-grid" id="gallery-grid">
       <!-- Images injected here -->
    </div>
    <!-- Actions Hidden/Overlay? -->
    <div class="gallery-header" style="display: none;"> <!-- Hide old header -->
       <div id="gallery-actions-default">
         <button class="gallery-btn" id="btn-gallery-delete">删除</button>
         <button class="gallery-btn" id="btn-gallery-save">保存</button>
       </div>
       <div id="gallery-actions-selection" style="display: none; align-items: center; gap: 10px;">
         <label style="color: white; font-size: 14px; display: flex; align-items: center; gap: 4px;">
            <input type="checkbox" id="chk-include-ink" checked> 包含笔迹
         </label>
         <button class="gallery-btn" id="btn-confirm-delete">确定删除</button>
         <button class="gallery-btn" id="btn-continue-save">继续保存</button>
       </div>
       <button class="icon-only-btn" id="btn-close-gallery"><i class="ri-close-line"></i></button>
    </div>
  </div>

  <script src="./renderer.js"></script>
</body>
</html>
